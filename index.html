<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0e13">
  <title>Forge — Gym Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#dashboard" aria-label="Forge home"><span class="brand-mark">F</span><span>forge<span class="accent">.</span></span></a>
      <nav class="main-nav" aria-label="Hoofdnavigatie">
        <a class="nav-link active" href="#dashboard" data-view="dashboard"><span class="nav-icon">⌂</span>Dashboard</a>
        <a class="nav-link" href="#workouts" data-view="workouts"><span class="nav-icon">▦</span>Mijn trainingen</a>
        <a class="nav-link" href="#exercises" data-view="exercises"><span class="nav-icon">◈</span>Oefeningen</a>
        <a class="nav-link" href="#history" data-view="history"><span class="nav-icon">↺</span>Geschiedenis</a>
      </nav>
      <div class="sidebar-bottom"><div class="quote">"Consistency is<br><strong>the real strength.</strong>"</div><div class="profile-mini"><div class="avatar">TO</div><div><strong>Taha Obaid</strong><small>Mijn profiel</small></div><span class="more">•••</span></div></div>
    </aside>

    <main class="main-content">
      <header class="topbar"><button class="mobile-menu" id="mobileMenu" aria-label="Menu">☰</button><div class="breadcrumb"><span>Forge</span><b>/</b><strong id="pageTitle">Dashboard</strong></div><div class="top-actions"><button class="icon-btn" id="themeToggle" title="Thema wisselen">☼</button><button class="icon-btn" title="Notificaties">♧<i></i></button><div class="avatar small">TO</div></div></header>
      <div id="app"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose">×</button><h2 id="modalTitle">Nieuwe training</h2><p class="modal-subtitle">Maak een trainingsdag om je oefeningen te organiseren.</p><form id="workoutForm"><label>Naam van de dag<input name="name" required placeholder="Bijv. Borst + Biceps"></label><label>Korte omschrijving<input name="description" placeholder="Bijv. Push focus"></label><div class="form-actions"><button type="button" class="btn ghost" id="cancelModal">Annuleren</button><button class="btn primary" type="submit">Opslaan</button></div></form></section></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
